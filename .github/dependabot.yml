version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Stay on Nuxt 3; major bumps (Nuxt 4 / vue-router 5) break current modules.
    ignore:
      - dependency-name: "nuxt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nuxtjs/tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@zadigetvoltaire/nuxt-gtm"
        update-types: ["version-update:semver-major"]
    groups:
      nuxt-ecosystem:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "vue"
          - "vue-router"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /infra/contact/lambda
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
